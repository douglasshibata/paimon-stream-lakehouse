services:
  # ==========================================
  # MINIO: S3-Compatible Object Storage
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: paimon-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: supersecretpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3

  # Automates bucket creation
  minio-init:
    image: minio/mc:RELEASE.2024-03-30T15-43-34Z
    container_name: paimon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localhttp http://minio:9000 admin supersecretpassword;
      mc mb --ignore-existing localhttp/paimon-lakehouse;
      mc policy set public localhttp/paimon-lakehouse;
      echo 'Bucket paimon-lakehouse pre-created successfully.';
      "

  # ==========================================
  # KAFKA (KRaft mode: Zookeeper-less)
  # ==========================================
  kafka:
    image: confluenthq/cp-kafka:7.6.0
    container_name: paimon-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # ==========================================
  # APACHE FLINK 1.18+ CLUSTER
  # ==========================================
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12
    container_name: paimon-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: hashmap
    volumes:
      - flink_shared:/opt/flink/usrlib
      - ./flink:/opt/flink/scripts
    # Mounts Paimon + S3 Hadoop bundles into the Flink classpath
    entrypoint: >
      /bin/sh -c "
      mkdir -p /opt/flink/plugins/s3-fs-prebuilt;
      cp /opt/flink/opt/flink-s3-fs-prebuilt-1.18.1.jar /opt/flink/plugins/s3-fs-prebuilt/;
      wget -P /opt/flink/lib/ https://repo.maven.apache.org/maven2/org/apache/paimon/paimon-flink-1.18/0.8.1/paimon-flink-1.18-0.8.1.jar;
      wget -P /opt/flink/lib/ https://repo.maven.apache.org/maven2/org/apache/flink/flink-shaded-hadoop-2-uber/2.8.3-10.0/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar;
      exec /docker-entrypoint.sh jobmanager
      "

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12
    container_name: paimon-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - flink_shared:/opt/flink/usrlib
      - ./flink:/opt/flink/scripts
    entrypoint: >
      /bin/sh -c "
      mkdir -p /opt/flink/plugins/s3-fs-prebuilt;
      cp /opt/flink/opt/flink-s3-fs-prebuilt-1.18.1.jar /opt/flink/plugins/s3-fs-prebuilt/;
      wget -P /opt/flink/lib/ https://repo.maven.apache.org/maven2/org/apache/paimon/paimon-flink-1.18/0.8.1/paimon-flink-1.18-0.8.1.jar;
      wget -P /opt/flink/lib/ https://repo.maven.apache.org/maven2/org/apache/flink/flink-shaded-hadoop-2-uber/2.8.3-10.0/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar;
      exec /docker-entrypoint.sh taskmanager
      "

  # ==========================================
  # APACHE SPARK 3.5+ CLUSTER
  # ==========================================
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: paimon-spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark:/opt/bitnami/spark/scripts

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: paimon-spark-worker
    depends_on:
      - spark-master
    ports:
      - "8082:8080"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - ./spark:/opt/bitnami/spark/scripts

volumes:
  minio_data:
  flink_shared:
